name: Build and push images

on:
  schedule:
    - cron: "0 6 * * *"
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ forgejo.workflow }}-${{ forgejo.ref }}
  cancel-in-progress: ${{ forgejo.event_name == 'pull_request' }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Compute registry namespace
        run: |
          SERVER_URL="${{ forgejo.server_url }}"
          REGISTRY="${SERVER_URL#*://}"
          REPOSITORY="${{ forgejo.repository }}"
          echo "REGISTRY=$REGISTRY" >> "$GITHUB_ENV"
          echo "REGISTRY_NAMESPACE=$REGISTRY/${{ forgejo.repository_owner }}" >> "$GITHUB_ENV"
          echo "IMAGE_NAME=${REPOSITORY#*/}" >> "$GITHUB_ENV"

      - uses: https://data.forgejo.org/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install BlueBuild
        run: |
          podman create --name blue-build-installer ghcr.io/blue-build/cli:v0.9-installer
          podman cp blue-build-installer:/out/bluebuild /usr/bin/bluebuild
          podman rm blue-build-installer
          bluebuild --version

      - name: Generate Containerfile from recipe
        run: |
          if [ "${{ forgejo.event_name == 'schedule' }}" = "true" ]; then
            unset GITHUB_ACTIONS
          fi
          bluebuild generate ./recipes/recipe.yml -o Containerfile

      - name: Build
        id: build
        uses: https://data.forgejo.org/redhat-actions/buildah-build@719e3c40d8af9790c23eca13f7daa339f2867034 # v3.1.0
        with:
          image: ${{ env.IMAGE_NAME }}
          tags: latest
          containerfiles: ./Containerfile
          platforms: linux/amd64
          layers: true
          build-args: |
            IMAGE_REGISTRY=${{ env.REGISTRY_NAMESPACE }}

      - name: Push
        id: push
        if: forgejo.event_name != 'pull_request'
        uses: https://data.forgejo.org/redhat-actions/push-to-registry@94ade333c38ecc0e60e94785125d9a52ca423b37 # v3.0.0
        with:
          image: ${{ steps.build.outputs.image }}
          tags: ${{ steps.build.outputs.tags }}
          registry: ${{ env.REGISTRY_NAMESPACE }}
          username: ${{ forgejo.repository_owner }}
          password: ${{ secrets.PACKAGE_TOKEN }}

      - name: Install cosign
        if: forgejo.event_name != 'pull_request'
        uses: https://data.forgejo.org/sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v3.1.4

      - name: Log in to registry
        if: forgejo.event_name != 'pull_request'
        uses: https://github.com/redhat-actions/podman-login@50c2d9a331bb67c8fdab99b86455fad05e2e3252 # v2.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ forgejo.repository_owner }}
          password: ${{ secrets.PACKAGE_TOKEN }}

      - name: Sign image
        if: forgejo.event_name != 'pull_request'
        env:
          IMAGE_REF: ${{ env.REGISTRY_NAMESPACE }}/${{ env.IMAGE_NAME }}@${{ steps.push.outputs.digest }}
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          # Cosign prompts when this is unset
          COSIGN_PASSWORD: ""
        run: |
          cosign sign \
            --yes \
            --new-bundle-format=false \
            --use-signing-config=false \
            --key env://COSIGN_PRIVATE_KEY \
            "${IMAGE_REF}"
